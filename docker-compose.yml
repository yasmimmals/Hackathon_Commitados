services:
  db:
    image: postgres:16-alpine
    container_name: cocapec_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "5435:5432"            # 5435 na sua máquina -> 5432 no container
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: cocapec_backend
    restart: unless-stopped
    environment:
      # Dentro da rede do compose o host é "db" e a porta é 5432 (não 5435!)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Sao_Paulo
      # avisos ao fornecedor vão para o Mailpit (caixa de teste): http://localhost:8025
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app         # hot reload: editou o código, o uvicorn recarrega
    depends_on:
      db:
        condition: service_healthy

  mailpit:                     # caixa de e-mail de teste: http://localhost:8025
    image: axllent/mailpit
    container_name: cocapec_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"            # tela web com os e-mails recebidos
      - "1025:1025"            # SMTP

  adminer:                     # interface web para olhar o banco: http://localhost:8080
    image: adminer
    container_name: cocapec_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata: