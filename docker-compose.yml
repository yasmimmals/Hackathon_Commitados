services:
  db:
    image: postgres:16-alpine
    container_name: cocapec_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "5435:5432"            
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    container_name: cocapec_backend
    restart: unless-stopped
    environment:
      # Dentro da rede do compose o host é "db" e a porta é 5432 (não 5433!)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      TZ: America/Sao_Paulo
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app         # hot reload: editou o código, o uvicorn recarrega
    depends_on:
      db:
        condition: service_healthy

  adminer:                     # interface web para olhar o banco: http://localhost:8080
    image: adminer
    container_name: cocapec_adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
